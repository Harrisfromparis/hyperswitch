<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurolist - Task Management for Neurodiverse Individuals</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 Neurolist</h1>
            <p class="subtitle">Break down tasks into manageable steps</p>
        </header>

        <main>
            <!-- Task Creation Section -->
            <section class="create-task-section">
                <h2>Create New Task</h2>
                <form id="taskForm">
                    <div class="form-group">
                        <label for="taskTitle">Task Title:</label>
                        <input type="text" id="taskTitle" placeholder="e.g., Prepare for job interview" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="taskDescription">Description (optional):</label>
                        <textarea id="taskDescription" placeholder="Add any details about this task..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Steps:</label>
                        <div id="stepsContainer">
                            <div class="step-input-group">
                                <input type="text" class="step-input" placeholder="Step 1: Research the company" required>
                                <button type="button" class="remove-step-btn" aria-label="Remove step">×</button>
                            </div>
                        </div>
                        <button type="button" id="addStepBtn" class="secondary-btn">+ Add Step</button>
                    </div>

                    <button type="submit" class="primary-btn">Create Task</button>
                </form>
            </section>

            <!-- Tasks List Section -->
            <section class="tasks-section">
                <div class="section-header">
                    <h2>My Tasks</h2>
                    <div class="filter-controls">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="active">Active</button>
                        <button class="filter-btn" data-filter="completed">Completed</button>
                    </div>
                </div>
                
                <div id="tasksList" class="tasks-list">
                    <!-- Tasks will be dynamically added here -->
                </div>

                <div id="emptyState" class="empty-state">
                    <p>📝 No tasks yet. Create your first task above!</p>
                </div>
            </section>

            <!-- Statistics Section -->
            <section class="stats-section">
                <h3>📊 Your Progress</h3>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalTasks">0</div>
                        <div class="stat-label">Total Tasks</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="activeTasks">0</div>
                        <div class="stat-label">Active</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="completedTasks">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalSteps">0</div>
                        <div class="stat-label">Total Steps</div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>Made with ❤️ for neurodiverse individuals</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
